<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>n8n 实战课 · 本地商家线索挖掘机</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" id="marked-js"></script>
<style>
  :root{--brand:#ff6d5a;--ink:#1c1e21;--mut:#6b7280;--bd:#e5e7eb;--bg:#fafafa;--code:#f3f4f6}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);line-height:1.75}
  .hero{background:linear-gradient(120deg,#1f2937 0%,#374151 100%);color:#fff;padding:44px 24px 36px}
  .hero .wrap{max-width:860px;margin:0 auto}
  .tag{display:inline-block;background:var(--brand);color:#fff;font-size:12px;padding:3px 10px;border-radius:20px;letter-spacing:.5px}
  h1{font-size:26px;margin:14px 0 8px;line-height:1.3}
  .sub{color:#cbd5e1;font-size:14px}
  .wrap{max-width:860px;margin:0 auto;padding:24px}
  nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}
  nav a{display:inline-block;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:8px 14px;font-size:13px;text-decoration:none;color:var(--ink);transition:.15s}
  nav a:hover,nav a.on{border-color:var(--brand);color:var(--brand)}
  article{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:32px 36px}
  article h1{font-size:22px}
  article h2{font-size:18px;border-left:4px solid var(--brand);padding-left:10px;margin-top:34px}
  article h3{font-size:16px}
  article code{background:var(--code);padding:2px 6px;border-radius:4px;font-size:13px;font-family:Consolas,Menlo,monospace}
  article pre{background:#111827;color:#e5e7eb;padding:16px 18px;border-radius:8px;overflow-x:auto;font-size:13px;line-height:1.55}
  article pre code{background:none;color:inherit;padding:0}
  article table{border-collapse:collapse;width:100%;font-size:14px}
  article th,article td{border:1px solid var(--bd);padding:8px 12px;text-align:left}
  article th{background:var(--code)}
  article blockquote{border-left:4px solid var(--brand);margin:16px 0;padding:8px 18px;background:#fff7f5;color:#9a3412;border-radius:0 8px 8px 0}
  .foot{color:var(--mut);font-size:12px;text-align:center;padding:28px}
  a{color:var(--brand)}
  .lb{color:var(--mut);font-size:12px}
</style>
</head>
<body>
<div class="hero"><div class="wrap">
  <span class="tag">n8n 实战课 · 第 01 课</span>
  <h1>用 Bright Data + GPT + Sheets + Slack<br>构建本地商家线索挖掘机</h1>
  <div class="sub">32 节点模板逐段拆解 · 31 项单元断言全绿 · 可复制的业务流水线</div>
</div></div>
<div class="wrap">
  <nav id="nav"></nav>
  <article id="doc"></article>
  <div class="foot">n8n 工作流视频教案 · 用 n8n 学和教 n8n</div>
</div>
<script>
// 内容路径：页面与 md 同根时用相对路径（GitHub Pages）；
// 单页托管（阿里云 n8n webhook / 本地直接打开）时回退到 GitHub raw。
const RAW='https://raw.githubusercontent.com/xinchun575924529/n8n-lesson-01-google-maps-leads/main/';
const docs=[
  ['课程主页','README.md'],
  ['00 总览','docs/00-overview.md'],
  ['01 异步发现','docs/01-discovery.md'],
  ['02 缺口评分','docs/02-scoring.md'],
  ['03 去重冷却','docs/03-dedupe.md'],
  ['04 AI 简报','docs/04-ai-brief.md'],
  ['05 入库播报','docs/05-publishing.md'],
  ['口播稿','script/short-video.md'],
  ['练习','exercises/exercises.md'],
];
const nav=document.getElementById('nav');
docs.forEach((d,i)=>{const a=document.createElement('a');a.textContent=d[0];a.href='#/'+i;a.dataset.i=i;nav.appendChild(a);});
function cur(){const m=location.hash.match(/#\/(\d+)/);return m?Number(m[1]):0}
async function fetchText(path){
  // 先试相对路径（同根部署场景），失败则回退 GitHub raw（单页托管场景）
  try{
    const r=await fetch(path,{cache:'no-store'});
    if(r.ok)return await r.text();
  }catch(e){/* 继续走 raw */}
  const r2=await fetch(RAW+path,{cache:'no-store'});
  if(!r2.ok)throw new Error('HTTP '+r2.status);
  return await r2.text();
}
async function show(i){
  nav.querySelectorAll('a').forEach(a=>a.className=Number(a.dataset.i)===i?'on':'');
  const el=document.getElementById('doc');el.innerHTML='<p class="lb">加载中…</p>';
  try{
    const t=await fetchText(docs[i][1]);
    document.title=docs[i][0]+' · n8n 教案';
    el.innerHTML=marked.parse(t);
  }catch(e){el.innerHTML='<p>加载失败：'+e.message+'</p>'}
}
window.addEventListener('hashchange',()=>show(cur()));
show(cur());
</script>
</body>
</html>
